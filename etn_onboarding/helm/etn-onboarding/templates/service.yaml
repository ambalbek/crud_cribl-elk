apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-etn-onboarding
  labels:
    app: etn-onboarding
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: etn-onboarding
    release: {{ .Release.Name }}
